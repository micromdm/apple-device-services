name: CI/CD
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    types: [opened, reopened, synchronize]
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - run: |
          curl -RLo jsonschema.zip https://github.com/sourcemeta/jsonschema/releases/download/v12.10.1/jsonschema-12.10.1-linux-x86_64.zip
          echo "e119043eb27c835b1b640f73924e7126733f17e85efc4c2e59ae19342acb8a6a  jsonschema.zip" | sha256sum -c -
          unzip -j jsonschema.zip '*/bin/jsonschema'

      # The OpenAPI documents beside the schemas are not JSON Schemas.
      - run: ./jsonschema lint */schemas $(for f in */schemas/OpenAPI.json; do echo "-i $f"; done)

      - run: ./jsonschema fmt -c */schemas $(for f in */schemas/OpenAPI.json; do echo "-i $f"; done)

      - run: python3 tools/sortkeys.py --check */patches/*.json

      - run: python3 tools/sortkeys.py --check */schemas/OpenAPI.json
